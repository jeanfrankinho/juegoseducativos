
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Arrastre</title>
<button onclick="leerInstrucciones()">
🔊 Escuchar instrucciones
</button>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#a72727,#4d1414);
    text-align:center;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
    color:#da1c03b4;
}

.palabras{
    margin:20px 0;
}

.palabra{
    display:inline-block;
    padding:12px 20px;
    margin:10px;
    background:#ffeb3b;
    border-radius:10px;
    font-weight:bold;
    cursor:grab;
}

.zona{
    border:3px dashed #ff0000;
    background:#f5f5f5;
    min-height:60px;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

.correcta{
    background:#a5d6a7;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#resultado{
    font-size:24px;
    font-weight:bold;
    margin-top:20px;
}

body{
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
    background-image:url("img/fondo juego.jpg");
    background-size:cover;
    background-position:center;
}

.contenedor{
    max-width:950px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:25px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(255,0,0,0.5);
}

h1{
    color:#d50000;
    text-shadow:2px 2px yellow;
}

.palabra{
    display:inline-block;
    padding:15px 25px;
    margin:10px;
    background:#ffd600;
    border-radius:15px;
    font-weight:bold;
    cursor:grab;
    transition:0.3s;
}

.palabra:hover{
    transform:scale(1.1);
}

.zona{
    width:180px;
    height:180px;
    border-radius:50%;
    border:6px solid #2196f3;
    background:linear-gradient(135deg,#bbdefb,#e3f2fd);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    margin:20px auto;
    padding:15px;
    font-weight:bold;
    font-size:18px;
    box-shadow:0 0 20px rgba(33,150,243,0.5);
    transition:0.3s;
}
.zona b{
    display:block;
    margin-top:10px;
    color:#d50000;
    font-size:22px;
}
.zona:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px rgba(33,150,243,0.8);
}

.zona:hover{
    background:#e3f2fd;
}

.correcta{
    background:#81c784 !important;
    animation:brillo 0.5s infinite alternate;
}

@keyframes brillo{
    from{transform:scale(1);}
    to{transform:scale(1.03);}
}

#resultado{
    font-size:28px;
    margin-top:20px;
    color:#d50000;
    font-weight:bold;
}


</style>
</head>
<body>

<div class="contenedor">

<h1>💧 Arrastra la palabra correcta 💧</h1>

<div class="palabras">

<div class="palabra" draggable="true" id="evaporacion">
Evaporación
</div>

<div class="palabra" draggable="true" id="condensacion">
Condensación
</div>

<div class="palabra" draggable="true" id="precipitacion">
Precipitación
</div>

</div>

<div class="zona" data-correcta="evaporacion">
El agua se convierte en vapor y sube al cielo.
</div>

<div class="zona" data-correcta="condensacion">
El vapor forma nubes.
</div>

<div class="zona" data-correcta="precipitacion">
Cae lluvia, nieve o granizo.
</div>

<button onclick="revisar()">
✅ Revisar
</button>

<div id="resultado"></div>

</div>

<script>
    function leerInstrucciones(){

    speechSynthesis.cancel();

    const voz =
    new SpeechSynthesisUtterance(
    "Arrastra la palabra correcta a cada círculo y luego presiona revisar."
    );

    voz.lang = "es-CL";
    speechSynthesis.speak(voz);
}

const palabras =
document.querySelectorAll(".palabra");

const zonas =
document.querySelectorAll(".zona");

palabras.forEach(palabra=>{

    palabra.addEventListener("dragstart",e=>{
        e.dataTransfer.setData("text",palabra.id);
    });

});

zonas.forEach(zona=>{

    const textoOriginal = zona.innerHTML;

    zona.addEventListener("dragover",e=>{
        e.preventDefault();
    });

    zona.addEventListener("drop",e=>{

        e.preventDefault();

        const dato =
        e.dataTransfer.getData("text");

        zona.dataset.usuario = dato;

        // Reemplaza el contenido anterior
        zona.innerHTML =
        textoOriginal +
        "<br><br><b>" +
        document.getElementById(dato).textContent +
        "</b>";

    });

});


function revisar(){

    let puntos = 0;
    let correctas = 0;
    let incorrectas = 0;

    zonas.forEach(zona=>{

        if(zona.dataset.usuario === zona.dataset.correcta){
            puntos++;
            correctas++;
        }else{
            incorrectas++;
        }

    });

    localStorage.setItem("puntos", puntos);
    localStorage.setItem("correctas", correctas);
    localStorage.setItem("incorrectas", incorrectas);

    window.location.href = "felicidades.html";

}

window.onload = function(){

    const texto =
    "Arrastra la palabra correcta. " +
    "El agua se convierte en vapor y sube al cielo. " +
    "El vapor forma nubes. " +
    "Cae lluvia, nieve o granizo. " +
    "Luego presiona el botón revisar.";

    const voz =
    new SpeechSynthesisUtterance(texto);

    voz.lang = "es-CL";
    voz.rate = 0.9;

    speechSynthesis.speak(voz);

};

zonas.forEach(zona=>{

    zona.addEventListener("click",()=>{

        speechSynthesis.cancel();

        let texto =
        zona.textContent
        .replace(/[\u{1F300}-\u{1FAFF}]/gu,"")
        .trim();

        const voz =
        new SpeechSynthesisUtterance(texto);

        voz.lang = "es-CL";
        voz.rate = 0.9;

        speechSynthesis.speak(voz);

    });

});

</script>


</body>
</html>
