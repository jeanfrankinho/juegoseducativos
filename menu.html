<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menú de Actividades</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#ff0000,#000000);
    text-align:center;
    margin:0;
}

.contenedor{
    margin-top:50px;
}

h1{
    color:white;
}

.tarjeta{
    background:white;
    width:300px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}

.tarjeta:hover{
    transform:scale(1.05);
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#007bff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

img{
    width:120px;
}

</style>
</head>

<body>

<div class="contenedor">

<h1 id="saludo"></h1>

<div class="tarjeta" onclick="irActividad('pagina2.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/861/861512.png">
    <h2>🔢 Juego Matemático</h2>
    <button>Entrar</button>
</div>

<div class="tarjeta" onclick="irActividad('juego2.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <h2>📖 Comprensión Lectora</h2>
    <button>Entrar</button>
</div>

<div class="tarjeta" onclick="irActividad('juego3.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <h2>📖 verbos</h2>
    <button>Entrar</button>

</div>

<div class="tarjeta" onclick="irActividad('juego4.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <h2> adjetivo </h2>
    <button>Entrar</button>
    

</div>


<div class="tarjeta" onclick="irActividad('juego5.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <h2> ordena la oracion </h2>
    <button>Entrar</button>

</div>
    
<div class="tarjeta" onclick="irActividad('arrastre.html')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <h2>ciclos del agua</h2>
    <button>Entrar</button>
</div>
</div>

<script>

let nombre =
localStorage.getItem("nombreUsuario");

document.getElementById("saludo").innerHTML =
"👋 Bienvenido " + nombre;

function irActividad(pagina){
    window.location.href = pagina;
}



</script>

</body>
</html>
