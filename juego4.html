<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Caza del Adjetivo</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    min-height: 100vh;

    background:
    radial-gradient(circle at 10% 20%, #ffecd2 0%, transparent 40%),
    radial-gradient(circle at 90% 30%, #a1c4fd 0%, transparent 40%),
    radial-gradient(circle at 50% 80%, #c2ffd8 0%, transparent 40%),
    linear-gradient(135deg, #fdfbfb, #ebedee);
}

h3{
    color:#2c3e50;
}

.game-box {
    background: rgba(255, 255, 255, 0.95);
    max-width: 600px;
    margin: auto;
    padding: 25px;
    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    border: 3px solid #4CAF50;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 12px;

    background: linear-gradient(45deg, #4CAF50, #2ecc71);
    color: white;

    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#result {
    font-size: 22px;
    margin-top: 20px;
    font-weight: bold;
}

#score {
    color: #0077cc;
}

</style>
</head>

<body>

<h3>📚 Aprende jugando - Lenguaje 4° Básico</h3>

<div class="game-box">

    <h1>🕵️ La Caza del Adjetivo</h1>

    <p id="sentence"></p>

    <div id="options"></div>

    <p id="result"></p>
    <h2 id="score">Puntos: 0</h2>

</div>

<script>

const questions = [
    {
        sentence: "El perro juguetón corre por el parque.",
        adjective: "juguetón",
        options: ["perro", "corre", "juguetón"]
    },
    {
        sentence: "La casa grande tiene un jardín.",
        adjective: "grande",
        options: ["casa", "grande", "jardín"]
    },
    {
        sentence: "El dragón feroz protege el castillo.",
        adjective: "feroz",
        options: ["dragón", "protege", "feroz"]
    },
    {
        sentence: "La flor hermosa crece en primavera.",
        adjective: "hermosa",
        options: ["flor", "primavera", "hermosa"]
    }
];

let current = 0;
let score = 0;

function loadQuestion() {

    if (current >= questions.length) {
        document.getElementById("sentence").innerHTML =
        `🎉 Juego terminado. Tu puntuación final es ${score}`;

        document.getElementById("options").innerHTML = "";
        document.getElementById("result").innerHTML = "";
        return;
    }

    const q = questions[current];

    document.getElementById("sentence").textContent = q.sentence;
    document.getElementById("result").textContent = "";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.sort(() => Math.random() - 0.5);

    q.options.forEach(word => {

        const btn = document.createElement("button");
        btn.textContent = word;

        btn.onclick = () => checkAnswer(word);

        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(answer) {

    const correct = questions[current].adjective;

    if (answer === correct) {
        document.getElementById("result").textContent =
        "✅ ¡Correcto! Encontraste el adjetivo.";
        score += 10;
    } else {
        document.getElementById("result").textContent =
        "❌ Incorrecto. Inténtalo en la siguiente.";
    }

    document.getElementById("score").textContent =
    `Puntos: ${score}`;

    current++;

    setTimeout(loadQuestion, 1500);
}

loadQuestion();

</script>

</body>
</html>
