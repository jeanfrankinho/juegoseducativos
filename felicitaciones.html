<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado Final</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:linear-gradient(to right,#ff0000,#940808);
    margin:0;
    padding-top:50px;
}

.caja{
    background:white;
    width:80%;
    max-width:600px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h1{
    color:#d50000;
}

.correctas{
    color:green;
    font-size:30px;
    font-weight:bold;
}

.incorrectas{
    color:red;
    font-size:30px;
    font-weight:bold;
}

button{
    margin-top:20px;
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#2196f3;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1976d2;
}

</style>
</head>
<body>

<div class="caja">

<h1>🏆 ¡Felicidades!</h1>

<h2>Terminaste el aprendizaje del Ciclo del Agua 🌧️</h2>

<p class="correctas">
✅ Correctas: <span id="correctas"></span>
</p>

<p class="incorrectas">
❌ Incorrectas: <span id="incorrectas"></span>
</p>

<button onclick="window.location.href='index.html'">
🔄 Volver a empezar
</button>
<button onclick="window.location.href='arrastre.html'">
🎮 Siguiente Juego
</button>
</div>

<script>

document.getElementById("correctas").textContent =
localStorage.getItem("correctas") || 0;

document.getElementById("incorrectas").textContent =
localStorage.getItem("incorrectas") || 0;

</script>
<script>

const correctas =
parseInt(localStorage.getItem("correctas")) || 0;

const incorrectas =
parseInt(localStorage.getItem("incorrectas")) || 0;

document.getElementById("correctas").textContent = correctas;
document.getElementById("incorrectas").textContent = incorrectas;

window.onload = function(){

    const mensaje =
    `Felicitaciones. Respondiste correctamente ${correctas} preguntas. y  Tuviste ${incorrectas} respuestas incorrecta.`;

    const voz = new SpeechSynthesisUtterance(mensaje);

    voz.lang = "es-CL";
    voz.rate = 1.0;

    speechSynthesis.speak(voz);

};

</script>

</body>
</html>
