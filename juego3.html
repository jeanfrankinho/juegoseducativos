<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordena la Oración</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    min-height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 20%, #00ffff55 0%, transparent 25%),
    radial-gradient(circle at 80% 30%, #ff00ff55 0%, transparent 25%),
    radial-gradient(circle at 50% 80%, #00ff8855 0%, transparent 25%),
    linear-gradient(135deg,#050816,#0a1931,#000000);

    color:white;
    padding-top:40px;
}

.caja{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    width:80%;
    max-width:700px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    border:2px solid #00ffff;
    box-shadow:0 0 20px #00ffff;
}

h1{
    color:#00ffff;
    text-shadow:0 0 10px #00ffff;
}

.contenedor-palabras, .zona{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
    min-height:60px;
}

.palabra{
    padding:10px 15px;
    background:#00ffff;
    color:black;
    border-radius:10px;
    cursor:grab;
    font-weight:bold;
}

.zona{
    border:2px dashed #ffffff55;
    padding:15px;
    min-height:70px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#00ffff,#0066ff);
    color:white;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>

<body>

<div class="caja">

<h1>🧩 Ordena la Oración</h1>

<p>Arrastra las palabras en el orden correcto</p>

<!-- PALABRAS DESORDENADAS -->
<div class="contenedor-palabras" id="palabras">
    <div class="palabra" draggable="true">Pedro</div>
    <div class="palabra" draggable="true">juega</div>
    <div class="palabra" draggable="true">en</div>
    <div class="palabra" draggable="true">el</div>
    <div class="palabra" draggable="true">parque</div>
</div>

<!-- ZONA DONDE SE ORDENAN -->
<div class="zona" id="zona"></div>

<button onclick="verificar()">Verificar</button>

<p id="resultado"></p>

</div>

<script>

const palabras = document.querySelectorAll(".palabra");
const zona = document.getElementById("zona");

// DRAG START
palabras.forEach(p => {
    p.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text", e.target.innerText);
        e.target.style.opacity = "0.5";
    });

    p.addEventListener("dragend", e => {
        e.target.style.opacity = "1";
    });
});

// DROP ZONE
zona.addEventListener("dragover", e => {
    e.preventDefault();
});

zona.addEventListener("drop", e => {
    e.preventDefault();

    const texto = e.dataTransfer.getData("text");

    const nueva = document.createElement("div");
    nueva.classList.add("palabra");
    nueva.innerText = texto;

    zona.appendChild(nueva);
});

// VERIFICAR RESPUESTA
function verificar(){

    let orden = Array.from(zona.children)
    .map(el => el.innerText)
    .join(" ")
    .toLowerCase();

    let correcta = "pedro juega en el parque";

    if(orden === correcta){
        document.getElementById("resultado").innerHTML = "✅ ¡Correcto!";
        hablar("Excelente, lo hiciste muy bien");
    }else{
        document.getElementById("resultado").innerHTML = "❌ Intenta nuevamente";
        hablar("Revisa el orden de la oración");
    }
}

// VOZ
function hablar(texto){
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-CL";
    speechSynthesis.speak(voz);
}

</script>

</body>
</html>
