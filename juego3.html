<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordena la Oración - Niveles</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    min-height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 20%, #00ffff55 0%, transparent 25%),
    radial-gradient(circle at 80% 30%, #ff00ff55 0%, transparent 25%),
    radial-gradient(circle at 50% 80%, #00ff8855 0%, transparent 25%),
    linear-gradient(135deg,#050816,#0a1931,#000000);

    color:white;
    padding-top:40px;
}

.caja{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    width:80%;
    max-width:700px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    border:2px solid #00ffff;
    box-shadow:0 0 20px #00ffff;
}

h1{
    color:#00ffff;
}

.contenedor-palabras, .zona{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
    min-height:60px;
}

.palabra{
    padding:10px 15px;
    background:#00ffff;
    color:black;
    border-radius:10px;
    cursor:grab;
    font-weight:bold;
}

.zona{
    border:2px dashed #ffffff55;
    padding:15px;
    min-height:70px;
}

button{
    margin-top:10px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#00ffff,#0066ff);
    color:white;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>

<body>

<div class="caja">

<h1>🧩 Ordena la Oración</h1>

<h2 id="nivel">Nivel 1</h2>

<p id="instruccion">Arrastra las palabras en orden correcto</p>

<div class="contenedor-palabras" id="palabras"></div>

<div class="zona" id="zona"></div>

<button onclick="verificar()">Verificar</button>
<button onclick="siguienteNivel()">Siguiente nivel</button>

<p id="resultado"></p>

</div>

<script>

const niveles = [
    {
        palabras: ["Pedro","juega","en","el","parque"],
        respuesta: "pedro juega en el parque"
    },
    {
        palabras: ["La","niña","lee","un","libro"],
        respuesta: "la niña lee un libro"
    },
    {
        palabras: ["El","perro","corre","rápido"],
        respuesta: "el perro corre rápido"
    }
];

let nivelActual = 0;

const zona = document.getElementById("zona");
const contenedor = document.getElementById("palabras");

// CARGAR NIVEL
function cargarNivel(){

    zona.innerHTML = "";
    contenedor.innerHTML = "";
    document.getElementById("resultado").innerHTML = "";

    let nivel = niveles[nivelActual];

    document.getElementById("nivel").innerText = "Nivel " + (nivelActual + 1);

    let palabrasMezcladas = [...nivel.palabras]
        .sort(() => Math.random() - 0.5);

    palabrasMezcladas.forEach(texto => {
        let div = document.createElement("div");
        div.classList.add("palabra");
        div.draggable = true;
        div.innerText = texto;

        div.addEventListener("dragstart", e => {
            e.dataTransfer.setData("text", texto);
        });

        contenedor.appendChild(div);
    });
}

// DRAG & DROP
zona.addEventListener("dragover", e => {
    e.preventDefault();
});

zona.addEventListener("drop", e => {
    e.preventDefault();

    const texto = e.dataTransfer.getData("text");

    let div = document.createElement("div");
    div.classList.add("palabra");
    div.innerText = texto;

    zona.appendChild(div);
});

// VERIFICAR
function verificar(){

    let orden = Array.from(zona.children)
    .map(el => el.innerText)
    .join(" ")
    .toLowerCase();

    let correcta = niveles[nivelActual].respuesta;

    if(orden === correcta){
        document.getElementById("resultado").innerHTML = "✅ ¡Correcto!";
        hablar("Muy bien");
    }else{
        document.getElementById("resultado").innerHTML = "❌ Intenta nuevamente";
        hablar("Revisa el orden");
    }
}

// SIGUIENTE NIVEL
function siguienteNivel(){

    if(nivelActual < niveles.length - 1){
        nivelActual++;
        cargarNivel();
    }else{
        document.getElementById("resultado").innerHTML =
        "🏆 Terminaste todos los niveles";
        hablar("Felicitaciones, terminaste el juego");
    }
}

// VOZ
function hablar(texto){
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-CL";
    speechSynthesis.speak(voz);
}

// INICIO
cargarNivel();

</script>

</body>
</html>
