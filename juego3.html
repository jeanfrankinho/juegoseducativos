<body>

<div class="caja">

<h1>🧩 Ordena la Oración</h1>

<p>Ordena correctamente las siguientes palabras:</p>

<div class="palabras">
parque - juega - Pedro - el - en
</div>

<input type="text" id="respuesta"
placeholder="Escribe la oración correcta">

<br>

<button onclick="verificar()">
Verificar
</button>

<p id="resultado"></p>

</div>

<script>

function verificar(){

    let respuesta =
    document.getElementById("respuesta")
    .value
    .trim()
    .toLowerCase();

    let correcta =
    "pedro juega en el parque";

    if(respuesta === correcta){

        document.getElementById("resultado")
        .innerHTML = "✅ ¡Correcto!";

        document.getElementById("resultado")
        .style.color = "green";

        hablar("Excelente. La oración está correcta.");

    }else{

        document.getElementById("resultado")
        .innerHTML = "❌ Intenta nuevamente";

        document.getElementById("resultado")
        .style.color = "red";

        hablar("La respuesta no es correcta.");

    }

}

function hablar(texto){

    let voz =
    new SpeechSynthesisUtterance(texto);

    voz.lang = "es-CL";

    speechSynthesis.speak(voz);

}

</script>
