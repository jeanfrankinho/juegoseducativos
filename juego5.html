<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA PRO - Lenguaje</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;

    background:
    radial-gradient(circle at 10% 20%, #ffecd2 0%, transparent 40%),
    radial-gradient(circle at 90% 30%, #a1c4fd 0%, transparent 40%),
    radial-gradient(circle at 50% 80%, #c2ffd8 0%, transparent 40%),
    linear-gradient(135deg, #0f2027, #203a43, #2c5364);

    color: white;
}

.hud {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 2px solid #00e5ff;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #00e5ff, #2979ff);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

#mensaje {
    font-size: 24px;
    margin-top: 10px;
}

.ok { color: #00ff9d; }
.bad { color: #ff4d4d; }

#barraContainer {
    width: 100%;
    height: 18px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
}

#barra {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#00e5ff,#2979ff);
}

</style>
</head>

<body>

<h2>🎮 ULTRA PRO - Lenguaje 4° Básico</h2>

<div class="hud">
    <div>🏆 Puntos: <span id="puntos">0</span></div>
    <div>⭐ Estrellas: <span id="estrellas">0</span></div>
    <div>❤️ Vidas: <span id="vidas">3</span></div>
    <div>⏱️ Tiempo: <span id="tiempo">20</span></div>
</div>

<div class="container">

    <div id="barraContainer">
        <div id="barra"></div>
    </div>

    <h2 id="nivel"></h2>

    <div id="opciones"></div>

    <p id="mensaje"></p>

</div>

<script>

const sonidoOk = new Audio("https://www.myinstants.com/media/sounds/success-fanfare-trumpets.mp3");
const sonidoBad = new Audio("https://www.myinstants.com/media/sounds/wrong-answer-sound-effect.mp3");

const preguntas = [
{
    correcta: "María fue al parque a jugar.",
    opciones: ["maría fue al parque a jugar","María fue al parque a jugar.","María fue al parque a jugar"]
},
{
    correcta: "¿Dónde está mi mochila?",
    opciones: ["Donde está mi mochila?","¿Dónde está mi mochila?","¿Donde esta mi mochila?"]
},
{
    correcta: "Los niños estudian matemáticas.",
    opciones: ["Los niños estudian matematicas.","los niños estudian matemáticas.","Los niños estudian matemáticas."]
}
];

let i = 0;
let puntos = 0;
let estrellas = 0;
let vidas = 3;
let tiempo = 20;
let timer;
let gameOver = false;

/* TIMER */
function iniciarTiempo(){

    clearInterval(timer);
    tiempo = 20;

    document.getElementById("barra").style.width = "100%";

    timer = setInterval(() => {

        if(gameOver) return;

        tiempo--;

        document.getElementById("tiempo").innerText = tiempo;

        let porcentaje = (tiempo / 20) * 100;
        document.getElementById("barra").style.width = porcentaje + "%";

        if(tiempo <= 0){
            clearInterval(timer);
            perderVida();
        }

    }, 1000);
}

/* CARGAR */
function cargar(){

    if(gameOver){
        window.location.href = "final.html";
        return;
    }

    if(i >= preguntas.length){

        gameOver = true;

        document.getElementById("nivel").innerText = "🎉 ¡GANASTE!";
        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").innerText =
        `🏆 ${puntos} puntos | ⭐ ${estrellas}`;

        setTimeout(() => {
            window.location.href = "final.html";
        }, 1500);

        return;
    }

    document.getElementById("nivel").innerText = "Nivel " + (i + 1);

    let cont = document.getElementById("opciones");
    cont.innerHTML = "";

    let op = [...preguntas[i].opciones].sort(() => Math.random() - 0.5);

    op.forEach(o => {
        let btn = document.createElement("button");
        btn.innerText = o;
        btn.onclick = () => check(o);
        cont.appendChild(btn);
    });

    iniciarTiempo();
}

/* CHECK */
function check(opcion){

    if(gameOver) return;

    clearInterval(timer);

    let msg = document.getElementById("mensaje");
    let bonus = tiempo > 15 ? 5 : 0;

    if(opcion === preguntas[i].correcta){

        msg.innerText = "✅ Correcto +10";
        msg.className = "ok";

        puntos += 10 + bonus;
        estrellas++;

        sonidoOk.play();

        i++;

        setTimeout(cargar, 1200);

    } else {

        msg.innerText = "❌ Incorrecto, pierdes una vida";
        msg.className = "bad";

        sonidoBad.play();

        perderVida();

        setTimeout(cargar, 1200);
    }
}

/* VIDAS */
function perderVida(){

    vidas--;
    document.getElementById("vidas").innerText = vidas;

    if(vidas <= 0){

        gameOver = true;

        document.getElementById("nivel").innerText = "💀 GAME OVER";
        document.getElementById("opciones").innerHTML = "";

        setTimeout(() => {
            window.location.href = "final.html";
        }, 1500);

    }

}

/* INICIO */
cargar();

</script>

</body>
</html>
