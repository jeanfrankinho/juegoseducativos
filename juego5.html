<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego Pro - Oraciones</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 20px;
    margin: 0;

    background:
    radial-gradient(circle at 10% 20%, #ffecd2 0%, transparent 40%),
    radial-gradient(circle at 90% 30%, #a1c4fd 0%, transparent 40%),
    radial-gradient(circle at 50% 80%, #c2ffd8 0%, transparent 40%),
    linear-gradient(135deg, #0f2027, #203a43, #2c5364);

    color: white;
}

/* 🎮 HUD */
.hud {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-bottom: 15px;
    font-size: 18px;
}

/* 🧠 CAJA */
.container {
    max-width: 750px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 25px #00e5ff55;
}

/* 📝 BOTONES */
button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 18px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(45deg, #00e5ff, #2979ff);
    color: white;

    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* 📢 MENSAJE */
#mensaje {
    font-size: 24px;
    margin-top: 15px;
    font-weight: bold;
}

/* ✨ ANIMACIONES */
.ok { color: #00ff9d; animation: pop 0.4s; }
.bad { color: #ff5252; animation: shake 0.4s; }

@keyframes pop {
    0% { transform: scale(0.8); }
    100% { transform: scale(1); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
}

/* ❤️ vidas */
.vida {
    color: #ff4d4d;
}

</style>
</head>

<body>

<h2>📚 Juego Pro de Lenguaje</h2>

<div class="hud">
    <div>🏆 Puntos: <span id="puntos">0</span></div>
    <div>⭐ Estrellas: <span id="estrellas">0</span></div>
    <div>❤️ Vidas: <span id="vidas">3</span></div>
    <div>⏱️ Tiempo: <span id="tiempo">10</span>s</div>
</div>

<div class="container">

    <h2 id="nivel"></h2>
    <div id="opciones"></div>

    <p id="mensaje"></p>

</div>

<script>

const preguntas = [
{
    correcta: "María fue al parque a jugar.",
    opciones: [
        "maría fue al parque a jugar",
        "María fue al parque a jugar.",
        "María fue al parque a jugar"
    ]
},
{
    correcta: "¿Dónde está mi mochila?",
    opciones: [
        "Donde está mi mochila?",
        "¿Dónde está mi mochila?",
        "¿Donde esta mi mochila?"
    ]
},
{
    correcta: "Los niños estudian matemáticas.",
    opciones: [
        "Los niños estudian matematicas.",
        "los niños estudian matemáticas.",
        "Los niños estudian matemáticas."
    ]
}
];

let i = 0;
let puntos = 0;
let estrellas = 0;
let vidas = 3;
let tiempo = 10;
let timer;

/* ⏱️ TIMER */
function iniciarTiempo(){
    clearInterval(timer);
    tiempo = 10;

    timer = setInterval(() => {
        tiempo--;
        document.getElementById("tiempo").innerText = tiempo;

        if(tiempo <= 0){
            perderVida();
        }
    }, 1000);
}

/* 🔥 CARGAR PREGUNTA */
function cargar(){

    if(i >= preguntas.length){
        document.getElementById("nivel").innerText =
        "🎉 Juego terminado";

        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").innerText =
        `Puntaje final: ${puntos} | ⭐ ${estrellas}`;
        return;
    }

    document.getElementById("nivel").innerText =
    "Nivel " + (i + 1);

    document.getElementById("mensaje").innerText = "";

    let cont = document.getElementById("opciones");
    cont.innerHTML = "";

    let op = [...preguntas[i].opciones]
    .sort(() => Math.random() - 0.5);

    op.forEach(o => {
        let btn = document.createElement("button");
        btn.innerText = o;
        btn.onclick = () => check(o);
        cont.appendChild(btn);
    });

    iniciarTiempo();
}

/* 🎯 VERIFICAR */
function check(opcion){

    clearInterval(timer);

    let msg = document.getElementById("mensaje");

    if(opcion === preguntas[i].correcta){
        msg.innerText = "✅ ¡Correcto!";
        msg.className = "ok";

        puntos += 10;
        estrellas++;

        hablar("Muy bien");

    } else {
        msg.innerText = "❌ Incorrecto";
        msg.className = "bad";

        perderVida();
    }

    actualizar();

    i++;
    setTimeout(cargar, 1200);
}

/* ❤️ VIDAS */
function perderVida(){

    vidas--;
    actualizar();

    if(vidas <= 0){
        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").innerText =
        "💀 Game Over";
        clearInterval(timer);
    } else {
        i++;
        cargar();
    }
}

/* 📊 HUD */
function actualizar(){
    document.getElementById("puntos").innerText = puntos;
    document.getElementById("estrellas").innerText = estrellas;
    document.getElementById("vidas").innerText = vidas;
}

/* 🔊 VOZ */
function hablar(txt){
    let v = new SpeechSynthesisUtterance(txt);
    v.lang = "es-CL";
    speechSynthesis.speak(v);
}

cargar();

</script>

</body>
</html>
