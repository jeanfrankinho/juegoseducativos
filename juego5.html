<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuentra la Oración Correcta</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        text-align: center;
        padding: 20px;
        color: white;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: rgba(255,255,255,0.15);
        padding: 20px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
    }

    button {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: white;
        color: #333;
        transition: 0.3s;
    }

    button:hover {
        background: #ffe082;
        transform: scale(1.02);
    }

    #mensaje {
        font-size: 24px;
        margin-top: 20px;
        font-weight: bold;
    }

    #puntos {
        font-size: 22px;
        color: #fff176;
    }
</style>
</head>
<body>

<div class="container">
    <h1>📝 Encuentra la Oración Correcta</h1>
    <h2 id="nivel"></h2>

    <div id="opciones"></div>

    <p id="mensaje"></p>
    <p id="puntos">Puntos: 0</p>
</div>

<script>

const preguntas = [
{
    correcta: "María fue al parque a jugar.",
    opciones: [
        "maría fue al parque a jugar",
        "María fue al parque a jugar.",
        "María fue al parque a jugar"
    ]
},
{
    correcta: "¿Dónde está mi mochila?",
    opciones: [
        "Donde está mi mochila?",
        "¿Dónde está mi mochila?",
        "¿Donde esta mi mochila?"
    ]
},
{
    correcta: "Los niños estudian matemáticas.",
    opciones: [
        "Los niños estudian matematicas.",
        "los niños estudian matemáticas.",
        "Los niños estudian matemáticas."
    ]
},
{
    correcta: "¡Qué hermoso día hace hoy!",
    opciones: [
        "Que hermoso día hace hoy!",
        "¡Qué hermoso día hace hoy!",
        "¡Que hermoso dia hace hoy!"
    ]
}
];

let indice = 0;
let puntos = 0;

function cargarPregunta() {

    if(indice >= preguntas.length){
        document.getElementById("nivel").textContent =
            "🎉 ¡Juego terminado!";
        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").textContent =
            `Tu puntuación final es ${puntos}`;
        return;
    }

    document.getElementById("nivel").textContent =
        `Nivel ${indice + 1}`;

    document.getElementById("mensaje").textContent = "";

    const contenedor = document.getElementById("opciones");
    contenedor.innerHTML = "";

    let opciones = [...preguntas[indice].opciones];

    opciones.sort(() => Math.random() - 0.5);

    opciones.forEach(opcion => {
        const boton = document.createElement("button");
        boton.textContent = opcion;

        boton.onclick = () => verificar(opcion);

        contenedor.appendChild(boton);
    });
}

function verificar(seleccionada){

    if(seleccionada === preguntas[indice].correcta){
        document.getElementById("mensaje").textContent =
            "✅ ¡Correcto!";
        puntos += 10;
    }else{
        document.getElementById("mensaje").textContent =
            "❌ Incorrecto";
    }

    document.getElementById("puntos").textContent =
        `Puntos: ${puntos}`;

    indice++;

    setTimeout(cargarPregunta, 1200);
}

cargarPregunta();

</script>

</body>
</html>
