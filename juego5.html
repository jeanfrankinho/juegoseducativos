<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA PRO - Lenguaje</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;

    background:
    radial-gradient(circle at 10% 20%, #ffecd2 0%, transparent 40%),
    radial-gradient(circle at 90% 30%, #a1c4fd 0%, transparent 40%),
    radial-gradient(circle at 50% 80%, #c2ffd8 0%, transparent 40%),
    linear-gradient(135deg, #0f2027, #203a43, #2c5364);

    color: white;
}

/* HUD */
.hud {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

/* CAJA */
.container {
    max-width: 750px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 2px solid #00e5ff;
}

/* BOTONES */
button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #00e5ff, #2979ff);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* MENSAJES */
#mensaje {
    font-size: 24px;
    margin-top: 10px;
}

/* ANIMACIONES */
.ok { color: #00ff9d; animation: pop 0.3s; }
.bad { color: #ff4d4d; animation: shake 0.3s; }

@keyframes pop {
    0% { transform: scale(0.8); }
    100% { transform: scale(1); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
}

/* BARRA DE TIEMPO */
#barraContainer {
    width: 100%;
    height: 18px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
}

#barra {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#00e5ff,#2979ff);
    transition: 0.3s;
}

</style>
</head>

<body>

<h2>🎮 ULTRA PRO - Lenguaje 4° Básico</h2>

<div class="hud">
    <div>🏆 Puntos: <span id="puntos">0</span></div>
    <div>⭐ Estrellas: <span id="estrellas">0</span></div>
    <div>❤️ Vidas: <span id="vidas">3</span></div>
    <div>⏱️ Tiempo: <span id="tiempo">20</span></div>
</div>

<div class="container">

    <!-- BARRA TIEMPO -->
    <div id="barraContainer">
        <div id="barra"></div>
    </div>

    <h2 id="nivel"></h2>

    <div id="opciones"></div>

    <p id="mensaje"></p>

</div>

<script>

/* 🔊 SONIDOS */
const sonidoOk = new Audio("https://www.myinstants.com/media/sounds/success-fanfare-trumpets.mp3");
const sonidoBad = new Audio("https://www.myinstants.com/media/sounds/wrong-answer-sound-effect.mp3");

/* PREGUNTAS */
const preguntas = [
{
    correcta: "María fue al parque a jugar.",
    opciones: [
        "maría fue al parque a jugar",
        "María fue al parque a jugar.",
        "María fue al parque a jugar"
    ]
},
{
    correcta: "¿Dónde está mi mochila?",
    opciones: [
        "Donde está mi mochila?",
        "¿Dónde está mi mochila?",
        "¿Donde esta mi mochila?"
    ]
},
{
    correcta: "Los niños estudian matemáticas.",
    opciones: [
        "Los niños estudian matematicas.",
        "los niños estudian matemáticas.",
        "Los niños estudian matemáticas."
    ]
}
];

let i = 0;
let puntos = 0;
let estrellas = 0;
let vidas = 3;
let tiempo = 20;
let timer;

/* ⏱️ TIMER ULTRA PRO */
function iniciarTiempo(){

    clearInterval(timer);
    tiempo = 20;

    document.getElementById("barra").style.width = "100%";
    document.getElementById("barra").style.background =
        "linear-gradient(90deg,#00e5ff,#2979ff)";

    timer = setInterval(() => {

        tiempo--;

        document.getElementById("tiempo").innerText = tiempo;

        let porcentaje = (tiempo / 20) * 100;
        document.getElementById("barra").style.width = porcentaje + "%";

        if(tiempo <= 5){
            document.getElementById("barra").style.background = "#ff4d4d";
        }

        if(tiempo <= 0){
            clearInterval(timer);
            perderVida();
        }

    }, 1000);
}

/* CARGAR */
function cargar(){

    if(i >= preguntas.length){
        document.getElementById("nivel").innerText = "🎉 ¡GANASTE!";
        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").innerText =
        `🏆 ${puntos} puntos | ⭐ ${estrellas}`;
        return;
    }

    document.getElementById("nivel").innerText =
    "Nivel " + (i + 1);

    let cont = document.getElementById("opciones");
    cont.innerHTML = "";

    let op = [...preguntas[i].opciones]
    .sort(() => Math.random() - 0.5);

    op.forEach(o => {
        let btn = document.createElement("button");
        btn.innerText = o;
        btn.onclick = () => check(o);
        cont.appendChild(btn);
    });

    iniciarTiempo();
}

/* CHECK */
function check(opcion){

    clearInterval(timer);

    let msg = document.getElementById("mensaje");

    let bonus = tiempo > 15 ? 5 : 0; // 🧠 bonus por rapidez

    if(opcion === preguntas[i].correcta){

        msg.innerText = "✅ Correcto +10";
        msg.className = "ok";

        puntos += 10 + bonus;
        estrellas++;

        sonidoOk.play();
        hablar("Muy bien");

    } else {

        msg.innerText = "❌ Incorrecto";
        msg.className = "bad";

        sonidoBad.play();
        perderVida();
    }

    actualizar();

    i++;
    setTimeout(cargar, 1200);
}

/* VIDAS */
function perderVida(){

    vidas--;

    actualizar();

    if(vidas <= 0){
        document.getElementById("opciones").innerHTML = "";
        document.getElementById("mensaje").innerText =
        "💀 GAME OVER";
        clearInterval(timer);
    } else {
        i++;
        cargar();
    }
}

/* HUD */
function actualizar(){
    document.getElementById("puntos").innerText = puntos;
    document.getElementById("estrellas").innerText = estrellas;
    document.getElementById("vidas").innerText = vidas;
}

/* VOZ */
function hablar(txt){
    let v = new SpeechSynthesisUtterance(txt);
    v.lang = "es-CL";
    speechSynthesis.speak(v);
}

cargar();

</script>

</body>
</html>
