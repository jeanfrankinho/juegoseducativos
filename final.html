<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Logro Alcanzado!</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    text-align:center;

    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    overflow:hidden;
}

/* CAJA */
.card{
    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:25px;
    backdrop-filter: blur(10px);
    border:2px solid #00e5ff;
    box-shadow:0 0 25px #00e5ff;
    animation: pop 0.8s ease;
}

@keyframes pop{
    from{transform:scale(0.5); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

/* TEXTO */
h1{
    font-size:40px;
}

p{
    font-size:22px;
}

/* BOTÓN */
button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00e5ff,#2979ff);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<div class="card">

    <h1>🎉 ¡FELICITACIONES! 🎉</h1>

    <p>Has completado el juego con éxito</p>

    <!-- PUNTAJE -->
    <h2 id="puntaje">Puntaje total: 0</h2>

    <p>🏆 Excelente desempeño</p>

    <button onclick="volver()">
        🔄 Volver al menú
    </button>

</div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

// 🎯 obtener puntaje desde localStorage
let puntos = localStorage.getItem("puntos") || 0;

// mostrar puntaje
document.getElementById("puntaje").innerText =
"🏆 Puntaje total: " + puntos;

// 🎉 confeti
confetti({
    particleCount: 250,
    spread: 120,
    origin: { y: 0.6 }
});

// 🔊 voz de felicitación
let mensaje = new SpeechSynthesisUtterance(
    "Felicitaciones, has completado el juego con éxito"
);
mensaje.lang = "es-CL";
speechSynthesis.speak(mensaje);

// 🔁 volver al menú
function volver(){
    window.location.href = "menu.html";
}

</script>

</body>
</html>
