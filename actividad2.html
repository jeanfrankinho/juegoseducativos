<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprender a Contar</title>

<style>

    body{
        margin:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #fc0b0b, #290606);
        text-align:center;
    }

    .contenedor{
        width:90%;
        max-width:800px;
        margin:30px auto;
        background:rgb(255, 255, 255);
        padding:30px;
        border-radius:20px;
    }

    h1{
        color:#333;
    }

    .numero{
        font-size:100px;
        font-weight:bold;
        color:#ff0000;
        margin:20px 0;
    }

    .imagenes{
        display:flex;
        justify-content:center;
        gap:15px;
        flex-wrap:wrap;
        margin-top:20px;
    }

    .imagenes img{
        width:100px;
        transition:0.3s;
    }

    .imagenes img:hover{
        transform:scale(1.1);
    }

    button{
        margin-top:25px;
        padding:12px 25px;
        border:none;
        border-radius:10px;
        background:#007bff;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:#0056b3;
    }

</style>
</head>

<body>

<div class="contenedor">

    <h1>Aprendamos a Contar</h1>

    <h2 id="textoNumero">Número 1</h2>

    <div class="numero" id="numeroGrande">1</div>

    <div class="imagenes" id="contenedorImagenes">

    </div>

    <button onclick="escucharNumero()">
        🔊 Escuchar Número
    </button>

    <br>

    <button onclick="anteriorNumero()">
        ⬅ Anterior
    </button>

    <button onclick="siguienteNumero()">
        Siguiente ➡

        <button onclick="finalizarAprendizaje()">
    🎉 Finalizar Aprendizaje
</button>

    </button>

</div>

<script>

    let numeroActual = 1;

    function cargarNumero(){

        document.getElementById("textoNumero").innerHTML =
            "Número " + numeroActual;

        document.getElementById("numeroGrande").innerHTML =
            numeroActual;

        let contenedor =
            document.getElementById("contenedorImagenes");

        contenedor.innerHTML = "";

        // agregar imágenes según el número
        for(let i = 1; i <= numeroActual; i++){

            contenedor.innerHTML += `
                <img src="img/manzana.png">
            `;

        }

    }

    // audio
    function hablar(texto){

        let mensaje =
            new SpeechSynthesisUtterance(texto);

        mensaje.lang = "es-ES";

        speechSynthesis.speak(mensaje);

    }

    function escucharNumero(){

        hablar(numeroActual.toString());

    }

    // siguiente número
    function siguienteNumero(){

        if(numeroActual < 10){

            numeroActual++;

            cargarNumero();

            escucharNumero();

        }

    }

    // número anterior
    function anteriorNumero(){

        if(numeroActual > 1){

            numeroActual--;

            cargarNumero();

            escucharNumero();

        }

    }

    // iniciar
    cargarNumero();

</script>

<script>

function siguienteNumero(){

    if(numeroActual < 10){

        numeroActual++;

        cargarNumero();

        escucharNumero();

        // mensaje final
        if(numeroActual == 10){

            setTimeout(() => {

                alert("🎉 ¡Felicitaciones! Has finalizado el aprendizaje de los números.");

                hablar("Felicitaciones, terminaste el aprendizaje");

            }, 1000);

        }

    }

}
    mostrarCelebracion();



function irPagina(){

    window.location.href = "pagina2.html";

}

</script>

</script>
<style>

/* globo felicitaciones */
#globoFelicitacion{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:#ffeb3b;
    color:#ff0000;
    padding:30px 50px;
    border-radius:50px;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    z-index:9999;
    display:none;

    animation:flotar 2s infinite alternate;
}

/* serpentinas */
.serpentina{
    position:fixed;
    width:15px;
    height:80px;
    top:-100px;
    border-radius:10px;
    animation:caer 4s linear infinite;
    z-index:999;
}

/* animación globo */
@keyframes flotar{
    from{
        transform:translate(-50%, -50%) translateY(0px);
    }

    to{
        transform:translate(-50%, -50%) translateY(-15px);
    }
}

/* animación serpentinas */
@keyframes caer{

    0%{
        transform:translateY(-100px) rotate(0deg);
    }

    100%{
        transform:translateY(120vh) rotate(360deg);
    }

}

</style>

<!-- globo -->
<div id="globoFelicitacion">
    🎉 ¡FELICITACIONES! 🎉
</div>

<script>

function mostrarCelebracion(){

    // mostrar globo
    document.getElementById(
        "globoFelicitacion"
    ).style.display = "block";

    // crear serpentinas
    for(let i=0; i<40; i++){

        let serpentina =
            document.createElement("div");

        serpentina.classList.add("serpentina");

        serpentina.style.left =
            Math.random() * 100 + "vw";

        serpentina.style.background =
            `hsl(${Math.random()*360},100%,50%)`;

        serpentina.style.animationDuration =
            (Math.random()*3 + 2) + "s";

        document.body.appendChild(serpentina);

    }

}

</script>
<script>

function finalizarAprendizaje(){

    // mostrar celebración
    

    // voz
    hablar("Felicitaciones, terminaste el aprendizaje");

    // esperar 4 segundos y redirigir
    setTimeout(() => {

        window.location.href = "pagina2.html";

    }, 4000);

}

</script>


</body>
</html>
